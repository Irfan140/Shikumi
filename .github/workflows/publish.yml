name: publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run build

      - name: Verify publish contents (no secrets)
        run: |
          echo "=== npm pack dry-run ==="
          npm pack --dry-run
          echo "=== ensure no .env / .shikumi in pack ==="
          if npm pack --dry-run 2>&1 | grep -E "\.env|\.shikumi|\.db"; then
            echo "ERROR: secrets would be published!" && exit 1
          fi

      - name: Publish to npm
        run: npm publish --access public
